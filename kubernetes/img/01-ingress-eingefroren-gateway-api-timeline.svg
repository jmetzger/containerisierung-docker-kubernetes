<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Arial, Helvetica, sans-serif">

  <defs>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Hintergrund -->
  <rect x="1" y="1" width="958" height="398" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Titel -->
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">Vom Ingress zur Gateway API</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#57606a">Warum sich der empfohlene Kubernetes-Standard verschiebt</text>

  <!-- Box 1: 2019 GA -->
  <rect x="50" y="95" width="200" height="195" rx="10" fill="#eaeef2" stroke="#57606a" stroke-width="2"/>
  <text x="66" y="118" font-size="11" font-weight="bold" fill="#57606a">2019 &#183; GA</text>
  <text x="66" y="142" font-size="14" font-weight="bold" fill="#24292f">Ingress API</text>
  <text x="66" y="160" font-size="14" font-weight="bold" fill="#24292f">wird Standard</text>
  <line x1="66" y1="172" x2="234" y2="172" stroke="#d0d7de" stroke-width="1"/>
  <text x="66" y="192" font-size="11" fill="#24292f">- Basis-Routing (Host/Pfad)</text>
  <text x="66" y="208" font-size="11" fill="#24292f">- Rest per Annotation</text>
  <text x="66" y="224" font-size="11" fill="#24292f">  (pro Controller anders)</text>

  <!-- Pfeil 1 -> 2 -->
  <line x1="250" y1="192" x2="268" y2="192" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-grey)"/>

  <!-- Box 2: 2022 eingefroren -->
  <rect x="270" y="95" width="200" height="195" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
  <text x="286" y="118" font-size="11" font-weight="bold" fill="#cf222e">2022 &#183; SIG-Network</text>
  <text x="286" y="142" font-size="14" font-weight="bold" fill="#82071e">Ingress API</text>
  <text x="286" y="160" font-size="14" font-weight="bold" fill="#82071e">wird eingefroren</text>
  <line x1="286" y1="172" x2="454" y2="172" stroke="#ffc1ba" stroke-width="1"/>
  <text x="286" y="192" font-size="11" fill="#82071e">- keine neuen Features mehr</text>
  <text x="286" y="208" font-size="11" fill="#82071e">- nur noch Bugfixes/CVEs</text>
  <text x="286" y="224" font-size="11" fill="#82071e">- bleibt aber GA &amp; stabil</text>

  <!-- Pfeil 2 -> 3 -->
  <line x1="470" y1="192" x2="488" y2="192" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-grey)"/>

  <!-- Box 3: Okt 2023 Gateway API GA -->
  <rect x="490" y="95" width="200" height="195" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="506" y="118" font-size="11" font-weight="bold" fill="#0969da">Okt. 2023 &#183; GA</text>
  <text x="506" y="142" font-size="14" font-weight="bold" fill="#0a3069">Gateway API</text>
  <text x="506" y="160" font-size="14" font-weight="bold" fill="#0a3069">erreicht v1.0</text>
  <line x1="506" y1="172" x2="674" y2="172" stroke="#b6e3ff" stroke-width="1"/>
  <text x="506" y="192" font-size="11" fill="#0a3069">- offiziell Nachfolger</text>
  <text x="506" y="208" font-size="11" fill="#0a3069">  von Ingress</text>
  <text x="506" y="224" font-size="11" fill="#0a3069">- neue Features nur hier</text>

  <!-- Pfeil 3 -> 4 -->
  <line x1="690" y1="192" x2="708" y2="192" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-grey)"/>

  <!-- Box 4: heute empfohlener Standard -->
  <rect x="710" y="95" width="200" height="195" rx="10" fill="#dcffe4" stroke="#1a7f37" stroke-width="2"/>
  <text x="726" y="118" font-size="11" font-weight="bold" fill="#1a7f37">heute &#183; 2026</text>
  <text x="726" y="142" font-size="14" font-weight="bold" fill="#116329">Gateway API ist</text>
  <text x="726" y="160" font-size="14" font-weight="bold" fill="#116329">der Standard</text>
  <line x1="726" y1="172" x2="894" y2="172" stroke="#aceebb" stroke-width="1"/>
  <text x="726" y="192" font-size="11" fill="#116329">- kubernetes.io empfiehlt</text>
  <text x="726" y="208" font-size="11" fill="#116329">  den Umstieg</text>
  <text x="726" y="224" font-size="11" fill="#116329">- z.B. ingress-nginx</text>
  <text x="726" y="240" font-size="11" fill="#116329">  kuendigt EOL an</text>

  <!-- Hinweis-Leiste -->
  <rect x="50" y="310" width="860" height="60" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-dasharray="6 4"/>
  <text x="480" y="335" text-anchor="middle" font-size="12" font-style="italic" fill="#24292f">Ingress bleibt nutzbar (GA-Stabilit&#228;tsgarantie) - bekommt aber keine neuen Features mehr.</text>
  <text x="480" y="353" text-anchor="middle" font-size="12" font-style="italic" fill="#24292f">Empfehlung: neue Routing-Ressourcen m&#246;glichst als Gateway API (HTTPRoute) anlegen.</text>

</svg>
