<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Arial, Helvetica, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Hintergrund -->
  <rect x="1" y="1" width="898" height="458" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Titel -->
  <text x="450" y="38" text-anchor="middle" font-size="19" font-weight="bold" fill="#24292f">Welche Objekte braucht man?</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#57606a">Minimal-Setup im Vergleich</text>

  <!-- Spaltenkoepfe -->
  <text x="250" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#24292f">Ingress</text>
  <text x="650" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#24292f">Gateway API</text>

  <!-- VS -->
  <circle cx="450" cy="240" r="22" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <text x="450" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#57606a">VS</text>

  <!-- Ingress Box 1 -->
  <rect x="120" y="108" width="260" height="86" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="250" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#0a3069">Ingress</text>
  <text x="250" y="160" text-anchor="middle" font-size="12" fill="#0a3069">Host/Pfad-Regeln</text>
  <text x="250" y="178" text-anchor="middle" font-size="12" fill="#0a3069">+ Annotationen fuer den Rest</text>

  <line x1="250" y1="194" x2="250" y2="216" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Ingress Box 2 -->
  <rect x="120" y="222" width="260" height="86" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="250" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#24292f">IngressClass</text>
  <text x="250" y="274" text-anchor="middle" font-size="12" fill="#24292f">legt den Controller fest</text>
  <text x="250" y="292" text-anchor="middle" font-size="11" font-style="italic" fill="#57606a">(oft schon vorhanden)</text>

  <text x="250" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#24292f">2 Objekte</text>

  <!-- Gateway API Box 1 -->
  <rect x="520" y="108" width="260" height="70" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
  <text x="650" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#4b2e83">GatewayClass</text>
  <text x="650" y="155" text-anchor="middle" font-size="12" fill="#4b2e83">legt den Controller fest</text>

  <line x1="650" y1="178" x2="650" y2="196" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Gateway API Box 2 -->
  <rect x="520" y="202" width="260" height="70" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="650" y="229" text-anchor="middle" font-size="15" font-weight="bold" fill="#0a3069">Gateway</text>
  <text x="650" y="249" text-anchor="middle" font-size="12" fill="#0a3069">Listener: Port, Host, TLS</text>

  <line x1="650" y1="272" x2="650" y2="290" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Gateway API Box 3 -->
  <rect x="520" y="296" width="260" height="70" rx="10" fill="#dcffe4" stroke="#1a7f37" stroke-width="2"/>
  <text x="650" y="323" text-anchor="middle" font-size="15" font-weight="bold" fill="#116329">HTTPRoute</text>
  <text x="650" y="343" text-anchor="middle" font-size="12" fill="#116329">Host/Pfad/Header-Regeln</text>

  <text x="650" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#24292f">3 Objekte</text>
  <text x="650" y="418" text-anchor="middle" font-size="11" font-style="italic" fill="#57606a">(klar nach Rolle getrennt)</text>

</svg>
