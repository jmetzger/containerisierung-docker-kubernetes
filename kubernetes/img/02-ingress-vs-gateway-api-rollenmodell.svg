<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="Arial, Helvetica, sans-serif">

  <defs>
    <marker id="arrow-grey2" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Hintergrund -->
  <rect x="1" y="1" width="958" height="568" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Titel -->
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">Ressourcen- und Rollenmodell im Vergleich</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#57606a">Ingress: ein Objekt f&#252;r alles &#8212; Gateway API: getrennte Ressourcen pro Rolle</text>

  <!-- Linker Container: Ingress -->
  <rect x="50" y="90" width="380" height="435" rx="12" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <text x="240" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#24292f">Ingress</text>
  <text x="240" y="136" text-anchor="middle" font-size="11" font-style="italic" fill="#57606a">1 Objekt, 1 Rolle macht alles</text>

  <!-- Box A: spec.rules -->
  <rect x="75" y="150" width="330" height="75" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="90" y="173" font-size="13" font-weight="bold" fill="#0a3069">spec.rules</text>
  <text x="90" y="191" font-size="11" fill="#24292f">Host / Pfad &#8594; Service</text>
  <text x="90" y="207" font-size="11" fill="#24292f">(Basis-Routing, eingebaut)</text>

  <!-- Box B: Annotations -->
  <rect x="75" y="240" width="330" height="140" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
  <text x="90" y="263" font-size="12" font-weight="bold" fill="#7d4e00">Annotations (controller-spezifisch)</text>
  <text x="90" y="285" font-size="10.5" fill="#57606a" font-family="monospace">nginx.ingress.kubernetes.io/...</text>
  <text x="90" y="301" font-size="10.5" fill="#57606a" font-family="monospace">traefik.ingress.kubernetes.io/...</text>
  <text x="90" y="317" font-size="10.5" fill="#57606a" font-family="monospace">haproxy.org/...</text>
  <text x="90" y="341" font-size="10.5" font-style="italic" fill="#7d4e00">Kein Standard: Header-Matching,</text>
  <text x="90" y="357" font-size="10.5" font-style="italic" fill="#7d4e00">Traffic-Splitting, Rewrites &#8212; je</text>
  <text x="90" y="373" font-size="10.5" font-style="italic" fill="#7d4e00">Controller wieder anders</text>

  <!-- Box C: Konsequenz -->
  <rect x="75" y="395" width="330" height="95" rx="8" fill="#eaeef2" stroke="#57606a" stroke-width="2"/>
  <text x="90" y="418" font-size="12" font-weight="bold" fill="#24292f">Konsequenz</text>
  <text x="90" y="438" font-size="11" fill="#24292f">1 Objekt vermischt Routing</text>
  <text x="90" y="454" font-size="11" fill="#24292f">und Infra-Details</text>
  <text x="90" y="472" font-size="11" fill="#24292f">&#8594; meist pflegt 1 Team alles</text>

  <!-- Mitte: VS -->
  <circle cx="480" cy="300" r="26" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <text x="480" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#57606a">VS</text>

  <!-- Rechter Container: Gateway API -->
  <rect x="530" y="90" width="380" height="435" rx="12" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <text x="720" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#24292f">Gateway API</text>
  <text x="720" y="136" text-anchor="middle" font-size="11" font-style="italic" fill="#57606a">3 Objekte, klar getrennte Rollen</text>

  <!-- Box 1: GatewayClass -->
  <rect x="555" y="150" width="330" height="75" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
  <text x="570" y="169" font-size="10" font-weight="bold" fill="#6639ba">INFRA-/PLATFORM-TEAM</text>
  <text x="570" y="189" font-size="13" font-weight="bold" fill="#4b2e83">GatewayClass</text>
  <text x="570" y="207" font-size="11" fill="#4b2e83">welcher Controller? (z.B. traefik)</text>

  <!-- Pfeil 1 -> 2 -->
  <line x1="720" y1="225" x2="720" y2="243" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-grey2)"/>

  <!-- Box 2: Gateway -->
  <rect x="555" y="248" width="330" height="90" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="570" y="267" font-size="10" font-weight="bold" fill="#0969da">CLUSTER-OPERATOR / OPS-TEAM</text>
  <text x="570" y="287" font-size="13" font-weight="bold" fill="#0a3069">Gateway</text>
  <text x="570" y="305" font-size="11" fill="#0a3069">Listener: Ports, Hostnames, TLS</text>
  <text x="570" y="321" font-size="11" fill="#0a3069">IP- / LoadBalancer-Zuordnung</text>

  <!-- Pfeil 2 -> 3 -->
  <line x1="720" y1="338" x2="720" y2="356" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-grey2)"/>

  <!-- Box 3: HTTPRoute -->
  <rect x="555" y="361" width="330" height="129" rx="8" fill="#dcffe4" stroke="#1a7f37" stroke-width="2"/>
  <text x="570" y="380" font-size="10" font-weight="bold" fill="#1a7f37">APP-/DEV-TEAM</text>
  <text x="570" y="400" font-size="13" font-weight="bold" fill="#116329">HTTPRoute</text>
  <text x="570" y="416" font-size="10.5" font-style="italic" fill="#116329">(+ GRPCRoute, TCPRoute, ...)</text>
  <text x="570" y="436" font-size="11" fill="#116329">Pfade, Header-Matching,</text>
  <text x="570" y="452" font-size="11" fill="#116329">Traffic-Splitting/Weighting</text>
  <text x="570" y="470" font-size="11" fill="#116329">&#8594; nativ, ohne Annotationen</text>

  <!-- Abschluss-Hinweis -->
  <text x="480" y="545" text-anchor="middle" font-size="13" font-style="italic" fill="#57606a">Kernunterschied: Rollen-Trennung + native Routing-Features statt Annotationen-Wildwuchs</text>

</svg>
